# Auto-merge workflow — squash-merges non-draft PRs when CI passes
name: Auto-merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # Necessário para o step "Trigger downstream workflows" — sem isto o
  # dispatch do CI falha com 403.
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act when CI passed and was triggered by a pull_request event
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Find and squash-merge eligible PR
        id: merge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headBranch = context.payload.workflow_run.head_branch;
            const headSha   = context.payload.workflow_run.head_sha;

            const { data: prs } = await github.rest.pulls.list({
              owner, repo,
              state: 'open',
              head: `${owner}:${headBranch}`,
            });

            // Skip draft PRs; verify the SHA matches so we don't merge a stale run
            const eligible = prs.filter(pr => !pr.draft && pr.head.sha === headSha);

            if (eligible.length === 0) {
              core.info('No eligible non-draft PR found for this run — skipping.');
              core.setOutput('merged', 'false');
              return;
            }

            for (const pr of eligible) {
              core.info(`Squash-merging PR #${pr.number}: ${pr.title}`);
              try {
                await github.rest.pulls.merge({
                  owner, repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`,
                  commit_message: pr.body ?? '',
                });
                core.info(`PR #${pr.number} merged successfully.`);
                core.setOutput('merged', 'true');
              } catch (err) {
                core.setFailed(`Failed to merge PR #${pr.number}: ${err.message}`);
              }
            }

      # Motivo deste step: merges feitos via API com o GITHUB_TOKEN (assim
      # como qualquer push feito por ele) NÃO disparam outros workflows que
      # escutam `push: branches: [main]` — é uma regra anti-loop do GitHub.
      # Sem isto, a CI ficaria silenciosamente parada na main após cada
      # auto-merge, e sync-to-site.yml (que só age em workflow_run de "CI"
      # com head_branch == main) nunca dispararia. NÃO REMOVER, mesmo que
      # pareça redundante: workflow_dispatch é a exceção documentada que o
      # GITHUB_TOKEN pode invocar para religar esses workflows manualmente.
      - name: Trigger downstream workflows
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'main',
            });
            core.info('Disparado workflow_dispatch em ci.yml (ref: main).');
