name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Exceção documentada à regra de anti-loop do GITHUB_TOKEN: pushes feitos
  # pelo GITHUB_TOKEN (incluindo o merge do auto-merge.yml) não disparam o
  # gatilho `push`, então o auto-merge rechama este workflow via
  # workflow_dispatch depois de mesclar na main. Sem isso, o CI nunca roda
  # de novo em main após um merge, e sync-to-site.yml (que só age quando o
  # workflow_run de "CI" tem head_branch == main) nunca dispara.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Validate JSON files and banco schema
        run: python build/validate_data.py

      - name: Run pytest
        run: python -m pytest build/tests/ -v

      - name: Validate JS syntax
        run: node --check js/app.js

      - name: Build pipeline smoke test
        run: |
          python build/build_banco_unificado.py
          test -f build/BANCO_UNIFICADO_CED.csv

      - name: Verify referenced files exist
        run: |
          test -f js/app.js
          test -f style.css
          test -f sw.js
          test -f manifest.json
          test -f index.html
